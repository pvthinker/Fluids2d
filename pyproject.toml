[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluids2d"
dynamic = ["version"]
description = 'A versatile Python CFD code that solves a large class of 2D flows'
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["CFD", "Geophysical Fluid Dynamics", "Fluid Solver"]
authors = [
  { name = "Guillaume Roullet", email = "roullet@univ-brest.fr" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
	     "matplotlib",
	     "netCDF4",
	     "numba",
	     "numpy",
	     "pillow",
	     "scipy",
	     "xarray"
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]

[project.urls]
Documentation = "https://github.com/pvthinker/fluids2d#readme"
Issues = "https://github.com/pvthinker/fluids2d/issues"
Source = "https://github.com/pvthinker/fluids2d"

[tool.hatch.version]
path = "src/fluids2d/__about__.py"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [
    "*.ipynb",
    "src/fluids2d/experiments/inpreparation",
    "src/fluids2d/experiments/hconv_ref",
    "src/fluids2d/experiments/horiz_longrun",
    # scratch / drafts (not versioned)
    "src/fluids2d/experiments/toto.py",
    "src/fluids2d/experiments/geos_adj_fdse.py",
    "src/fluids2d/experiments/geos_adj_fdse2026.py",
    "src/fluids2d/experiments/dambreak.py",
    "src/fluids2d/experiments/rayleigh_taylor.py",
    "src/fluids2d/experiments/tidal_wave.py",
    "src/fluids2d/experiments/tracer_fdse.py",
    "src/fluids2d/experiments/vortex_fdse.py",
    "src/fluids2d/experiments/warm_bubble_v0.py",
    "src/fluids2d/experiments/horizconv.py",
    "src/fluids2d/experiments/lockexchange_fall.py",
    "src/fluids2d/background_profile_v0.py",
    "src/fluids2d/background_profile_v1.py",
    "src/fluids2d/meanstate.py",
    "src/fluids2d/plot_diags_v0.py",
]

[tool.ruff.lint.per-file-ignores]
# star imports keep the equations registry readable
"src/fluids2d/equations.py" = ["F403", "F405"]
"src/fluids2d/meshes.py" = ["F403", "F405"]
